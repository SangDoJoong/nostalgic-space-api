[project]
name = "nostalgic-space-api"
version = "0.1.0"
description = "API service for Nostalgic Space"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.116.1",
    "passlib[bcrypt]>=1.7.4",
    "pendulum>=3.1.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.42",
    "sqlmodel>=0.0.24",
]

[tool.isort]
src_paths=["app"]
